name: Apply final favicon

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-favicon.yml'

permissions:
  contents: write

jobs:
  apply-favicon:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace favicon links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          new_links = '''<link rel="icon" type="image/png" sizes="32x32" href="/Pirates-of-the-White-Sands/potws-favicon-king-2026.png?v=20260924king1">
          <link rel="shortcut icon" type="image/png" href="/Pirates-of-the-White-Sands/potws-favicon-king-2026.png?v=20260924king1">
          <link rel="apple-touch-icon" href="/Pirates-of-the-White-Sands/potws-favicon-king-2026.png?v=20260924king1">'''

          pattern = re.compile(r'<link[^>]+rel=["\'](?:icon|shortcut icon|apple-touch-icon)["\'][^>]*>\s*', re.I)

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              cleaned = pattern.sub('', text)
              if '<head>' in cleaned:
                  cleaned = cleaned.replace('<head>', '<head>\n' + new_links, 1)
              elif '<head ' in cleaned:
                  cleaned = re.sub(r'(<head[^>]*>)', r'\1\n' + new_links, cleaned, count=1, flags=re.I)
              if cleaned != text:
                  path.write_text(cleaned, encoding='utf-8')
                  print('updated', path)
          PY

      - name: Commit directly to main
        run: |
          if git diff --quiet; then
            echo "No HTML changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Point every page at POTWS king favicon"
          git push origin HEAD:main
