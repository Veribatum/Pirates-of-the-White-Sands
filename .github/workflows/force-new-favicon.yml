name: Force new POTWS favicon filename

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-new-favicon.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace favicon references on every HTML page
        run: |
          python - <<'PY'
          from pathlib import Path
          old = '/Pirates-of-the-White-Sands/potws-favicon-final.png?v=20260924final2'
          new = '/Pirates-of-the-White-Sands/potws-king-logo-favicon-64.png?v=20260924king1'
          changed=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              if old in s:
                  p.write_text(s.replace(old,new),encoding='utf-8')
                  changed.append(str(p))
          print('Updated:', changed)
          PY
      - name: Commit migration and remove one-time workflow
        run: |
          rm .github/workflows/force-new-favicon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Force all pages to new POTWS king-logo favicon filename" || exit 0
          git push
