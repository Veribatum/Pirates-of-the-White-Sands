name: Add Calendar to Main Navigation

on:
  push:
    paths:
      - '.github/workflows/nav-calendar-fix.yml'

permissions:
  contents: write

jobs:
  patch-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Calendar link to homepage and Get Involved navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          for filename in ("index.html", "get-involved.html"):
              path = Path(filename)
              text = path.read_text()
              if 'href="calendar.html"' in text:
                  continue

              pattern = r'(<a(?:\s+class="[^"]*")?\s+href="meet-the-krewe\.html"[^>]*>\s*Meet the Crew\s*</a>)'
              replacement = r'\1\n        <a href="calendar.html">Calendar</a>'
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"Could not locate Meet the Crew nav link in {filename}")
              path.write_text(updated)

          Path('.github/workflows/nav-calendar-fix.yml').unlink()
      - name: Commit navigation fix
        run: |
          git config user.name "POTWS Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html get-involved.html .github/workflows/nav-calendar-fix.yml
          git commit -m "Add Calendar link to homepage and Get Involved nav"
          git push
