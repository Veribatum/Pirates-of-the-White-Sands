name: Fix favicon sitewide

on:
  push:
    paths:
      - '.github/workflows/fix-favicon.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace favicon links on all HTML pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          icon_block = '''<link rel="icon" type="image/svg+xml" href="/Pirates-of-the-White-Sands/potws-tab-icon.svg?v=20260924f">\n<link rel="alternate icon" type="image/png" href="/Pirates-of-the-White-Sands/favicon.png?v=20260924f">\n<link rel="shortcut icon" href="/Pirates-of-the-White-Sands/potws-tab-icon.svg?v=20260924f">'''

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text
              text = re.sub(r'\s*<link[^>]+(?:rel="(?:icon|shortcut icon|alternate icon)"|href="[^"]*favicon[^\"]*")[^>]*>\s*', '\n', text, flags=re.I)
              text = re.sub(r'(<head[^>]*>)', r'\1\n' + icon_block, text, count=1, flags=re.I)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print('updated', path)
          PY
      - name: Commit favicon updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No favicon changes needed"
            exit 0
          fi
          git commit -m "Use fresh POTWS favicon sitewide"
          git push
