name: Finalize POTWS favicon
on:
  push:
    paths:
      - '.github/workflows/finalize-favicon.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point every HTML page to final favicon
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          tag='''<link rel="icon" type="image/png" sizes="32x32" href="/Pirates-of-the-White-Sands/potws-favicon-final.png?v=20260924final">\n<link rel="shortcut icon" type="image/png" href="/Pirates-of-the-White-Sands/potws-favicon-final.png?v=20260924final">\n<link rel="apple-touch-icon" href="/Pirates-of-the-White-Sands/potws-favicon-final.png?v=20260924final">'''
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'\s*<link\s+[^>]*rel=["\'](?:shortcut icon|icon|apple-touch-icon)["\'][^>]*>\s*','\n',s,flags=re.I)
              if '<head>' in s:
                  s=s.replace('<head>','<head>\n'+tag,1)
              elif '<HEAD>' in s:
                  s=s.replace('<HEAD>','<HEAD>\n'+tag,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit favicon wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "Use final POTWS logo favicon sitewide"
            git push
          fi
